<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Permitir .htaccess overrides
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # Configurar API como alias hacia /api
    Alias /api /var/www/html/api

    <Directory /var/www/html/api>
        AllowOverride All
        Require all granted
        
        # Permitir archivos PHP
        <FilesMatch "\.php$">
            SetHandler application/x-httpd-php
        </FilesMatch>
    </Directory>

    # Configurar carpeta de assets
    <Directory /var/www/html/assets>
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/css>
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/js>
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/views>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
