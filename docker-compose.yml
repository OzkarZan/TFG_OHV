version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: autosync_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/autosync_db.sql:/docker-entrypoint-initdb.d/init.sql

  mailhog:
    image: mailhog/mailhog:latest
    container_name: autosync_mailhog
    restart: always
    ports:
      - "8025:8025"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autosync_backend
    restart: always
    environment:
      - APP_ENV=${APP_ENV}
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USER=${DB_USER}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - APP_URL=${APP_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - BOTPRESS_WEBHOOK_TOKEN=${BOTPRESS_WEBHOOK_TOKEN}
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
      - mailhog

  # 3. FRONTEND (WEB) <--- ESTA ES LA PARTE NUEVA
  frontend:
    image: nginx:alpine
    container_name: autosync_frontend
    restart: always
    ports:
      - "8080:80" # El tráfico de Cloudflare Tunnel vendrá por este puerto 8080
    volumes:
      - ./frontend:/usr/share/nginx/html # Mapea tu carpeta local 'frontend' al servidor web
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # Monta la configuración del proxy inverso

volumes:
  db_data:
