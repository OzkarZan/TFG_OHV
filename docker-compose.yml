version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: autosync_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autosync_db
    ports:
      - "3306:3306"
    volumes:
      # Este mapeo indica que cualquier .sql aquí se ejecutará automáticamente al crear la BBDD
      - ./database/autosync_db.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autosync_backend
    restart: always
    ports:
      - "8000:80"
    volumes:
      # Sincroniza la carpeta backend local con el servidor web
      - ./backend:/var/www/html
    depends_on:
      - db
