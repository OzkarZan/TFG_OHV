version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: autosync_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autosync_db
    ports:
      - "3306:3306"
    volumes:
      # Este mapeo indica que cualquier .sql aquí se ejecutará automáticamente al crear la BBDD
      - ./database/autosync_db.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autosync_web
    restart: always
    ports:
      - "5500:80"
    volumes:
      # Sincroniza ambas carpetas
      - ./backend:/var/www/html/api
      - ./frontend:/var/www/html
    depends_on:
      - db
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
