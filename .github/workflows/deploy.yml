name: Deploy AutoSync to production

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar el código más reciente
        uses: actions/checkout@v4

      - name: Crear archivo .env desde Secrets
        run: |
          cat > .env << 'ENVEOF'
          APP_ENV=production
          APP_URL=${{ secrets.APP_URL }}
          DB_HOST=db
          DB_NAME=${{ secrets.DB_NAME }}
          DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SMTP_ENCRYPTION=${{ secrets.SMTP_ENCRYPTION }}
          MAIL_FROM=${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME=AutoSync
          BOTPRESS_WEBHOOK_TOKEN=${{ secrets.BOTPRESS_WEBHOOK_TOKEN }}
          ENVEOF

      - name: Desplegar con Docker Compose
        run: |
          docker compose build backend frontend
          docker compose up -d --remove-orphans

      - name: Limpiar imágenes Docker antiguas
        run: docker image prune -f
