<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Área - AutoSync</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet" integrity="sha512-t4GWSVZO1eC8BM339Xd7Uphw5s17a86tIZIj8qRxhnKub6WoyhnrxeCIMeAqBPgdZGlCcG2PrZjMc+Wr78+5Xg==" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <style>
        body { background: #f4f6f9; font-family: 'Manrope', sans-serif; }
        .client-navbar { background: #fff; border-bottom: 1px solid #e8ecf0; }
        .brand { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: #0062a0; }
        .tab-btn { border: none; background: none; padding: 10px 20px; font-weight: 600; color: #6c757d; border-bottom: 3px solid transparent; transition: all .2s; cursor: pointer; }
        .tab-btn.active { color: #0062a0; border-bottom-color: #0062a0; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .estado-badge { font-size: .78rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .estado-En\ Proceso    { background: #d0eaff; color: #0062a0; }
        .estado-Esperando\ Piezas { background: #fff3cd; color: #856404; }
        .estado-Finalizada     { background: #d1f5e0; color: #1a6b3c; }
        .estado-Pendiente      { background: #f0f0f0; color: #555; }
        .estado-Confirmada     { background: #d1f5e0; color: #1a6b3c; }
        .estado-Cancelada      { background: #fde8e8; color: #c0392b; }
        .card-rep { border-left: 4px solid #0062a0; }
        .card-rep.finalizada { border-left-color: #1a6b3c; }
        .vehicle-pill { background: #e8f0fe; color: #0062a0; border-radius: 20px; padding: 4px 14px; font-size: .85rem; font-weight: 600; display: inline-block; }
        .empty-state { text-align: center; padding: 48px 0; color: #aaa; }
        .empty-state i { font-size: 3rem; margin-bottom: 16px; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="client-navbar py-3 px-4 d-flex justify-content-between align-items-center shadow-sm">
        <a href="index.html" class="text-decoration-none">
            <span class="brand fs-5">AutoSync</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <img id="clientAvatar" src="https://ui-avatars.com/api/?name=C&background=0055d4&color=fff"
                 alt="Avatar" class="rounded-circle" width="36" height="36">
            <span class="fw-bold text-dark d-none d-md-inline" id="clientName">Cargando...</span>
            <button id="btnLogout" class="btn btn-outline-danger btn-sm rounded-pill fw-bold px-3">
                <i class="fas fa-sign-out-alt me-1"></i> Salir
            </button>
        </div>
    </nav>

    <!-- Hero resumen -->
    <div class="bg-primary text-white py-4 px-4">
        <div class="container-lg">
            <h4 class="fw-bold mb-0">Hola, <span id="heroName">...</span></h4>
            <p class="mb-0 opacity-75 small">Aquí puedes seguir el estado de tu vehículo en tiempo real.</p>
        </div>
    </div>

    <!-- Tabs -->
    <div class="bg-white border-bottom px-4">
        <div class="container-lg d-flex gap-0">
            <button class="tab-btn active" data-tab="reparaciones"><i class="fas fa-tools me-1"></i> Reparaciones</button>
            <button class="tab-btn" data-tab="citas"><i class="fas fa-calendar-check me-1"></i> Citas</button>
            <button class="tab-btn" data-tab="vehiculos"><i class="fas fa-car me-1"></i> Mis vehículos</button>
            <button class="tab-btn" data-tab="presupuestos"><i class="fas fa-file-invoice-dollar me-1"></i> Presupuestos</button>
        </div>
    </div>

    <!-- Contenido -->
    <main class="container-lg py-4 px-4">

        <!-- Tab Reparaciones -->
        <div class="tab-pane active" id="tab-reparaciones">
            <div id="repList">
                <div class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div> Cargando...</div>
            </div>
        </div>

        <!-- Tab Citas -->
        <div class="tab-pane" id="tab-citas">
            <div class="d-flex justify-content-end mb-3">
                <button class="btn btn-primary rounded-pill px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#modalNuevaCita">
                    <i class="fas fa-plus me-2"></i>Nueva Cita
                </button>
            </div>
            <div id="citaList">
                <div class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div> Cargando...</div>
            </div>
        </div>

        <!-- Tab Vehículos -->
        <div class="tab-pane" id="tab-vehiculos">
            <div class="d-flex justify-content-end mb-3">
                <button class="btn btn-primary rounded-pill px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#modalNuevoVehiculo">
                    <i class="fas fa-plus me-2"></i>Añadir Vehículo
                </button>
            </div>
            <div id="vehList">
                <div class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div> Cargando...</div>
            </div>
        </div>

        <!-- Tab Presupuestos -->
        <div class="tab-pane" id="tab-presupuestos">
            <div id="presList">
                <div class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div> Cargando...</div>
            </div>
        </div>

    </main>

    <!-- Modal Nueva Cita -->
    <div class="modal fade" id="modalNuevaCita" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="fas fa-calendar-plus text-primary me-2"></i>Nueva Cita</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formNuevaCita">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Fecha y hora</label>
                            <input type="datetime-local" id="ncFechaHora" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Vehículo <span class="text-muted fw-normal">(opcional)</span></label>
                            <select id="ncVehiculo" class="form-select">
                                <option value="">Sin vehículo asignado</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Motivo de la visita</label>
                            <textarea id="ncMotivo" class="form-control" rows="3" placeholder="Describe brevemente el motivo..." required></textarea>
                        </div>
                        <div id="ncError" class="alert alert-danger d-none"></div>
                        <div class="d-grid">
                            <button type="submit" id="btnNcSubmit" class="btn btn-primary rounded-pill fw-bold">
                                <i class="fas fa-check me-2"></i>Solicitar Cita
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nuevo Vehículo -->
    <div class="modal fade" id="modalNuevoVehiculo" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="fas fa-car text-primary me-2"></i>Añadir Vehículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formNuevoVehiculo">
                        <div class="row g-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Marca</label>
                                <input type="text" id="nvMarca" class="form-control" placeholder="Toyota, BMW...">
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">Modelo <span class="text-danger">*</span></label>
                                <input type="text" id="nvModelo" class="form-control" placeholder="Corolla, Serie 3..." required>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">Matrícula <span class="text-danger">*</span></label>
                                <input type="text" id="nvMatricula" class="form-control text-uppercase" placeholder="1234ABC" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">Año</label>
                                <input type="number" id="nvAnio" class="form-control" placeholder="2020" min="1980" max="2030">
                            </div>
                        </div>
                        <div id="nvError" class="alert alert-danger d-none mt-3"></div>
                        <div class="d-grid mt-3">
                            <button type="submit" id="btnNvSubmit" class="btn btn-primary rounded-pill fw-bold">
                                <i class="fas fa-plus me-2"></i>Añadir Vehículo
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 text-muted small border-top bg-white mt-4">
        © 2026 AutoSync — Gestión de Precisión para Talleres Modernos.
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js" integrity="sha512-VK2zcvntEufaimc+efOYi622VN5ZacdnufnmX7zIhCPmjhKnOi9ZDMtg1/ug5l183f19gG1/cBstPO4D8N/Img==" crossorigin="anonymous"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async () => {

        // ── Auth check ──────────────────────────────────────────────────────────
        let userData;
        try {
            const res = await fetch('/api/auth/me', { credentials: 'include' });
            if (!res.ok) { window.location.href = 'index.html'; return; }
            userData = await res.json();
            if (userData.rol !== 'cliente') { window.location.href = 'dashboard.html'; return; }
        } catch { window.location.href = 'index.html'; return; }

        document.getElementById('clientName').textContent = userData.nombre_completo;
        document.getElementById('heroName').textContent   = userData.nombre_completo.split(' ')[0];
        document.getElementById('clientAvatar').src =
            `https://ui-avatars.com/api/?name=${encodeURIComponent(userData.nombre_completo)}&background=0055d4&color=fff`;

        // ── Logout ───────────────────────────────────────────────────────────────
        document.getElementById('btnLogout').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.href = 'index.html';
        });

        // ── Tabs ─────────────────────────────────────────────────────────────────
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });

        // ── Cargar datos ─────────────────────────────────────────────────────────
        let reparaciones = [], citas = [], vehiculos = [];

        try {
            const res  = await fetch('/api/mi-area', { credentials: 'include' });
            const data = await res.json();
            reparaciones = data.reparaciones || [];
            citas        = data.citas        || [];
            vehiculos    = data.vehiculos    || [];
        } catch (e) {
            console.error('Error cargando datos:', e);
        }

        renderReparaciones(reparaciones);
        renderCitas(citas);
        renderVehiculos(vehiculos);
        await renderPresupuestos();

        // ── Renders ───────────────────────────────────────────────────────────────

        function badge(estado) {
            const safe = estado.replace(/[<>&"]/g, '');
            return `<span class="estado-badge estado-${safe}">${safe}</span>`;
        }

        function esc(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderReparaciones(list) {
            const el = document.getElementById('repList');
            if (list.length === 0) {
                el.innerHTML = `<div class="empty-state"><i class="fas fa-tools"></i><br>No tienes reparaciones registradas todavía.</div>`;
                return;
            }
            el.innerHTML = list.map(r => `
                <div class="card border-0 shadow-sm mb-3 card-rep ${r.estado === 'Finalizada' ? 'finalizada' : ''}">
                    <div class="card-body py-3">
                        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                            <div>
                                <div class="fw-bold text-dark">${esc(r.modelo_auto)} <span class="text-muted fw-normal small">(${esc(r.matricula)})</span></div>
                                <div class="small text-muted mt-1">${esc(r.descripcion_motivo)}</div>
                                ${r.diagnostico ? `<div class="small mt-2"><strong>Diagnóstico:</strong> ${esc(r.diagnostico)}</div>` : ''}
                                ${r.fecha_entrada ? `<div class="small text-muted mt-1"><i class="fas fa-calendar-alt me-1"></i>Entrada: ${r.fecha_entrada}</div>` : ''}
                                ${r.fecha_salida  ? `<div class="small text-muted"><i class="fas fa-calendar-check me-1 text-success"></i>Salida: ${r.fecha_salida}</div>` : ''}
                            </div>
                            <div class="d-flex flex-column align-items-end gap-2">
                                ${badge(r.estado)}
                                ${badge(r.estado_presupuesto)}
                            </div>
                        </div>
                    </div>
                </div>`).join('');
        }

        function renderCitas(list) {
            const el = document.getElementById('citaList');
            if (list.length === 0) {
                el.innerHTML = `<div class="empty-state"><i class="fas fa-calendar-times"></i><br>No tienes citas programadas.</div>`;
                return;
            }
            el.innerHTML = list.map(c => {
                const fecha = new Date(c.fecha_hora).toLocaleString('es-ES', { dateStyle: 'long', timeStyle: 'short' });
                return `
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body py-3">
                        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                            <div>
                                <div class="fw-bold text-dark">${esc(c.motivo)}</div>
                                <div class="small text-muted mt-1"><i class="fas fa-clock me-1"></i>${fecha}</div>
                                ${c.matricula ? `<div class="small text-muted"><i class="fas fa-car me-1"></i>${esc(c.matricula)} — ${esc(c.modelo)} ${esc(c.marca||'')}</div>` : ''}
                            </div>
                            <div>${badge(c.estado)}</div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderVehiculos(list) {
            const el = document.getElementById('vehList');
            if (list.length === 0) {
                el.innerHTML = `<div class="empty-state"><i class="fas fa-car"></i><br>No tienes vehículos registrados.</div>`;
                return;
            }
            el.innerHTML = `<div class="row g-3">${list.map(v => `
                <div class="col-md-6 col-lg-4">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body">
                            <div class="d-flex align-items-center gap-3 mb-2">
                                <div class="bg-primary text-white rounded p-2"><i class="fas fa-car"></i></div>
                                <div>
                                    <div class="fw-bold">${esc(v.marca||'')} ${esc(v.modelo)}</div>
                                    <div class="vehicle-pill mt-1">${esc(v.matricula)}</div>
                                </div>
                            </div>
                            ${v.anio ? `<div class="small text-muted"><i class="fas fa-calendar me-1"></i>Año: ${esc(v.anio)}</div>` : ''}
                        </div>
                    </div>
                </div>`).join('')}</div>`;
        }

        // ── Nueva Cita (modal) ────────────────────────────────────────────────────
        const modalNuevaCita = document.getElementById('modalNuevaCita');
        modalNuevaCita.addEventListener('show.bs.modal', () => {
            const sel = document.getElementById('ncVehiculo');
            sel.innerHTML = '<option value="">Sin vehículo específico</option>';
            vehiculos.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.id_vehiculo;
                opt.textContent = `${v.marca || ''} ${v.modelo} (${v.matricula})`.trim();
                sel.appendChild(opt);
            });
            document.getElementById('ncFechaHora').value = '';
            document.getElementById('ncMotivo').value = '';
            document.getElementById('ncError').classList.add('d-none');
        });

        document.getElementById('formNuevaCita').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl  = document.getElementById('ncError');
            const btn    = document.getElementById('btnNcSubmit');
            const payload = {
                fecha_hora:  document.getElementById('ncFechaHora').value,
                motivo:      document.getElementById('ncMotivo').value.trim(),
                id_vehiculo: document.getElementById('ncVehiculo').value || null,
            };
            errEl.classList.add('d-none');
            btn.disabled = true;
            try {
                const res  = await fetch('/api/mi-area/cita', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await res.json();
                if (!res.ok) { errEl.textContent = data.message || 'Error al crear la cita.'; errEl.classList.remove('d-none'); return; }
                bootstrap.Modal.getInstance(modalNuevaCita).hide();
                const r2  = await fetch('/api/mi-area', { credentials: 'include' });
                const d2  = await r2.json();
                citas     = d2.citas || [];
                renderCitas(citas);
            } catch { errEl.textContent = 'Error de conexión.'; errEl.classList.remove('d-none'); }
            finally { btn.disabled = false; }
        });

        // ── Nuevo Vehículo (modal) ────────────────────────────────────────────────
        const modalNuevoVehiculo = document.getElementById('modalNuevoVehiculo');
        modalNuevoVehiculo.addEventListener('show.bs.modal', () => {
            ['nvMarca','nvModelo','nvMatricula','nvAnio'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('nvError').classList.add('d-none');
        });

        document.getElementById('formNuevoVehiculo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl  = document.getElementById('nvError');
            const btn    = document.getElementById('btnNvSubmit');
            const payload = {
                marca:     document.getElementById('nvMarca').value.trim(),
                modelo:    document.getElementById('nvModelo').value.trim(),
                matricula: document.getElementById('nvMatricula').value.trim().toUpperCase(),
                anio:      document.getElementById('nvAnio').value || null,
            };
            errEl.classList.add('d-none');
            btn.disabled = true;
            try {
                const res  = await fetch('/api/mi-area/vehiculo', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await res.json();
                if (!res.ok) { errEl.textContent = data.message || 'Error al añadir el vehículo.'; errEl.classList.remove('d-none'); return; }
                bootstrap.Modal.getInstance(modalNuevoVehiculo).hide();
                const r2  = await fetch('/api/mi-area', { credentials: 'include' });
                const d2  = await r2.json();
                vehiculos = d2.vehiculos || [];
                renderVehiculos(vehiculos);
            } catch { errEl.textContent = 'Error de conexión.'; errEl.classList.remove('d-none'); }
            finally { btn.disabled = false; }
        });

        async function renderPresupuestos() {
            const estadoBadge = {
                'Borrador':  'bg-secondary',
                'Enviado':   'bg-warning text-dark',
                'Aprobado':  'bg-success',
                'Rechazado': 'bg-danger'
            };
            const el = document.getElementById('presList');
            try {
                const res  = await fetch('/api/mi-area/presupuestos', { credentials: 'include' });
                const text = await res.text();
                let list;
                try { list = JSON.parse(text); } catch {
                    el.innerHTML = `<div class="alert alert-danger">Respuesta inesperada del servidor: <pre class="small mt-1 mb-0">${text.slice(0, 300)}</pre></div>`;
                    return;
                }
                if (!res.ok) {
                    el.innerHTML = `<div class="alert alert-danger">${list.message || 'Error del servidor.'}</div>`;
                    return;
                }
                if (!Array.isArray(list) || list.length === 0) {
                    el.innerHTML = `<div class="empty-state"><i class="fas fa-file-invoice-dollar"></i><br>Aún no tienes presupuestos disponibles.</div>`;
                    return;
                }
                el.innerHTML = list.map(p => `
                    <div class="card border-0 shadow-sm mb-3">
                        <div class="card-body py-3">
                            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                                <div>
                                    <div class="fw-bold">${esc(p.vehiculo_str) || 'Presupuesto de Reparación'}</div>
                                    <div class="small text-muted mt-1">
                                        <i class="fas fa-calendar me-1"></i>${p.fecha_emision}
                                        &nbsp;·&nbsp; Total: <strong>€${parseFloat(p.gran_total).toFixed(2)}</strong>
                                        &nbsp;·&nbsp; <span class="badge ${estadoBadge[p.estado] || 'bg-secondary'}">${p.estado}</span>
                                    </div>
                                </div>
                                <div class="d-flex gap-2 flex-wrap align-items-center">
                                    <a href="/api/presupuestos?id_presupuesto=${p.id_presupuesto}"
                                       target="_blank"
                                       class="btn btn-outline-primary btn-sm rounded-pill fw-bold px-3">
                                        <i class="fas fa-file-pdf me-1"></i> PDF
                                    </a>
                                    ${p.estado !== 'Aprobado' && p.estado !== 'Rechazado' ? `
                                    <button onclick="responderPresupuesto(${p.id_presupuesto}, 'aceptar')"
                                            class="btn btn-success btn-sm rounded-pill fw-bold px-3">
                                        <i class="fas fa-check me-1"></i> Aceptar
                                    </button>
                                    <button onclick="responderPresupuesto(${p.id_presupuesto}, 'rechazar')"
                                            class="btn btn-outline-danger btn-sm rounded-pill fw-bold px-3">
                                        <i class="fas fa-times me-1"></i> Rechazar
                                    </button>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>`).join('');
            } catch (e) {
                el.innerHTML = '<div class="alert alert-danger">Error al cargar presupuestos.</div>';
            }
        }

        window.responderPresupuesto = async function(id_presupuesto, accion) {
            const texto = accion === 'aceptar' ? 'aceptar' : 'rechazar';
            if (!confirm(`¿Seguro que quieres ${texto} este presupuesto?`)) return;
            try {
                const res = await fetch('/api/mi-area/presupuestos', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ id_presupuesto, accion })
                });
                const data = await res.json();
                if (res.ok) {
                    await renderPresupuestos();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (e) {
                alert('Error de conexión.');
            }
        };

    });
    </script>
</body>
