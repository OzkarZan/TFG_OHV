<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Cliente - AutoSync</title>
    <!-- Mismas fuentes y estilos de index.html -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    
    <!-- Navbar simple para el cliente -->
    <nav class="navbar navbar-light bg-white border-bottom shadow-sm py-3 px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
            <span class="fs-5 fw-bold text-primary">AutoSync</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-muted fw-bold d-none d-md-inline" id="clientName">Conectado como Cliente</span>
            <a href="index.html" class="btn btn-outline-danger btn-sm rounded-pill fw-bold px-3">Cerrar Sesión</a>
        </div>
    </nav>

    <!-- Contenido principal centrado -->
    <main class="flex-grow-1 d-flex justify-content-center align-items-center p-4">
        <div class="text-center">
            <i class="fas fa-tools fs-1 text-primary mb-4" style="opacity: 0.8;"></i>
            <h1 class="fw-bold" style="font-family: 'Space Grotesk', sans-serif;">PANTALLA DE CLIENTE</h1>
            <h4 class="text-muted mb-4">En Construcción</h4>
            <p class="text-secondary mx-auto" style="max-width: 500px;">
                Aquí podrás ver en el futuro el estado de la reparación de tu vehículo en tiempo real. 
                Actualmente estamos trabajando en esta sección.
            </p>
            <a href="index.html" class="btn btn-primary-custom mt-4 px-5 py-2 shadow-sm rounded-pill">Vover al inicio</a>
        </div>
    </main>

    <!-- Footer base -->
    <footer class="bg-white border-top py-4 text-center">
        <p class="text-muted small mb-0 fw-bold">© 2024 AutoSync. Tu taller de confianza.</p>
    </footer>

</body>
</html>
