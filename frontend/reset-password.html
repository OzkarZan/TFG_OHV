<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña - AutoSync</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet" integrity="sha512-t4GWSVZO1eC8BM339Xd7Uphw5s17a86tIZIj8qRxhnKub6WoyhnrxeCIMeAqBPgdZGlCcG2PrZjMc+Wr78+5Xg==" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { background: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .reset-card { max-width: 420px; width: 100%; background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 4px 24px rgba(0,0,0,.1); }
        .brand { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.5rem; color: #0062a0; }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="text-center mb-4">
            <div class="brand mb-1">AutoSync</div>
            <h5 class="fw-bold" id="pageTitle">Restablecer contraseña</h5>
            <p class="text-muted small" id="pageSubtitle">Introduce tu nueva contraseña</p>
        </div>

        <!-- Formulario de solicitud (cuando no hay token en la URL) -->
        <form id="forgotForm">
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted text-uppercase">Correo electrónico</label>
                <input type="email" id="forgotEmail" class="form-control" placeholder="nombre@ejemplo.com" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Enviar enlace</button>
            <div class="text-center mt-3">
                <a href="index.html" class="text-muted small text-decoration-none">← Volver al inicio</a>
            </div>
        </form>

        <!-- Formulario de nueva contraseña (cuando hay token en la URL) -->
        <form id="resetForm" class="d-none">
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted text-uppercase">Nueva contraseña</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Mínimo 8 caracteres" required minlength="8">
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-muted text-uppercase">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Repite la contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Guardar nueva contraseña</button>
        </form>

        <!-- Mensaje de resultado -->
        <div id="resultMsg" class="d-none mt-3 text-center"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const token  = params.get('token');

        const forgotForm = document.getElementById('forgotForm');
        const resetForm  = document.getElementById('resetForm');
        const resultMsg  = document.getElementById('resultMsg');
        const subtitle   = document.getElementById('pageSubtitle');

        if (token) {
            forgotForm.classList.add('d-none');
            resetForm.classList.remove('d-none');
            subtitle.textContent = 'Elige una nueva contraseña para tu cuenta.';
        }

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = forgotForm.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'Enviando...';

            try {
                const res  = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('forgotEmail').value })
                });
                const data = await res.json();
                forgotForm.classList.add('d-none');
                resultMsg.classList.remove('d-none');
                resultMsg.innerHTML = `<div class="alert alert-success">${data.message}</div>
                    <a href="index.html" class="text-muted small">← Volver al inicio</a>`;
            } catch {
                btn.disabled = false;
                btn.textContent = 'Enviar enlace';
                resultMsg.classList.remove('d-none');
                resultMsg.innerHTML = '<div class="alert alert-danger">Error de conexión. Inténtalo de nuevo.</div>';
            }
        });

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass    = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (pass !== confirm) {
                resultMsg.classList.remove('d-none');
                resultMsg.innerHTML = '<div class="alert alert-warning">Las contraseñas no coinciden.</div>';
                return;
            }

            const btn = resetForm.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'Guardando...';

            try {
                const res  = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, password: pass })
                });
                const data = await res.json();
                resetForm.classList.add('d-none');
                resultMsg.classList.remove('d-none');
                if (res.ok) {
                    resultMsg.innerHTML = `<div class="alert alert-success">${data.message}</div>
                        <a href="index.html" class="btn btn-primary mt-2 w-100">Iniciar sesión</a>`;
                } else {
                    resultMsg.innerHTML = `<div class="alert alert-danger">${data.message}</div>
                        <a href="reset-password.html" class="text-muted small">Solicitar nuevo enlace</a>`;
                    btn.disabled = false;
                    btn.textContent = 'Guardar nueva contraseña';
                }
            } catch {
                btn.disabled = false;
                btn.textContent = 'Guardar nueva contraseña';
                resultMsg.classList.remove('d-none');
                resultMsg.innerHTML = '<div class="alert alert-danger">Error de conexión. Inténtalo de nuevo.</div>';
            }
        });
    });
    </script>
</body>
</html>
